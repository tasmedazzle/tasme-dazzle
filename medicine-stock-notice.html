<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>German Homeo Hall — WhatsApp স্টক নোটিশ</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f3f6f4;color:#18221d;margin:0}.wrap{max-width:650px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e3eae5;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 5px 22px #173b2a0b}h1{margin:0 0 4px;font-size:23px}h2{margin-top:0}label{display:block;font-size:14px;font-weight:700;margin:13px 0}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d5ded8;border-radius:11px;margin-top:6px;font:inherit}button{border:0;border-radius:11px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:#25734d;color:#fff}.wa{background:#168c52;color:#fff}.secondary{background:#eaf3ee;color:#195b3a}.msg{white-space:pre-wrap;background:#f7faf8;border:1px solid #e2e9e4;border-radius:12px;padding:14px;line-height:1.65}.ok{color:#16734a;font-weight:800}.bad{color:#b42318;font-weight:800}.muted{color:#66746d;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.stock{font-size:18px;font-weight:900;margin:10px 0}.hide{display:none!important}</style></head><body><div class="wrap"><div class="card"><h1>📢 WhatsApp স্টক নোটিশ</h1><p class="muted">ক্রেতার WhatsApp নাম্বার ও ঔষধের নাম লিখুন। সিস্টেম স্টক দেখে মেসেজ তৈরি করবে। WhatsApp বাটনে চাপলে নম্বরসহ মেসেজটি WhatsApp-এ খুলবে।</p><label>ক্রেতার WhatsApp নাম্বার<input id="phone" inputmode="tel" placeholder="017XXXXXXXX" required></label><label>ঔষধের নাম<input id="medicine" list="medlist" placeholder="যেমন: Argen met 200" required><datalist id="medlist"></datalist></label><div class="actions"><button class="primary" onclick="checkStock()">🔎 স্টক চেক করে মেসেজ তৈরি</button></div><p id="status" class="muted"></p></div><div id="result" class="card hide"><h2>💬 নোটিশ মেসেজ</h2><div id="stock" class="stock"></div><div id="message" class="msg"></div><div class="actions" style="margin-top:12px"><button class="wa" onclick="openWhatsApp()">📲 WhatsApp-এ পাঠান</button><button class="secondary" onclick="copyMessage()">📋 মেসেজ কপি</button></div><p class="muted" style="margin-top:12px">নোট: এটি WhatsApp-এ মেসেজটি তৈরি করে খুলবে; আপনার অনুমতি ছাড়া স্বয়ংক্রিয়ভাবে মেসেজ পাঠায় না।</p></div></div><script>const SUPABASE_URL='https://xhddvvvdynxabhdorsju.supabase.co';const SUPABASE_KEY='sb_publishable_aw8D0PEOLoPqEOMMQUBp6A_XeriyvD3';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let finalMessage='';let finalPhone='';async function loadMedicines(){const {data,error}=await db.from('medicines').select('name').order('name');if(error)return;document.getElementById('medlist').innerHTML=(data||[]).map(x=>'<option value="'+esc(x.name)+'"></option>').join('')}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function cleanPhone(v){let p=String(v||'').replace(/[^0-9+]/g,'');if(p.startsWith('+880'))return p.slice(1);if(p.startsWith('880'))return p;if(p.startsWith('01')&&p.length===11)return '88'+p;return p.replace(/^\+/,'')}async function checkStock(){const phone=document.getElementById('phone').value.trim();const name=document.getElementById('medicine').value.trim();const status=document.getElementById('status');const result=document.getElementById('result');if(!phone||!name){status.textContent='নাম্বার ও ঔষধের নাম দিন।';status.className='bad';return}status.textContent='স্টক চেক করা হচ্ছে...';status.className='muted';const {data,error}=await db.from('medicines').select('name,stock').ilike('name',name).limit(1);if(error){status.textContent='স্টক চেক করা যায়নি: '+error.message;status.className='bad';return}let med=data&&data[0];let displayName=med?med.name:name;let stock=med?Number(med.stock||0):0;let inStock=!!med&&stock>0;const shop='German Homeo Hall';if(inStock){document.getElementById('stock').innerHTML='<span class="ok">✅ '+displayName+' স্টকে আছে — '+stock+' টি</span>';finalMessage='আসসালামু আলাইকুম।\n\n'+shop+' থেকে জানানো যাচ্ছে, আপনার চাহিদার ঔষধ "'+displayName+'" বর্তমানে আমাদের স্টকে পাওয়া যাচ্ছে।\n\nপ্রয়োজনে আমাদের সাথে যোগাযোগ করুন। ধন্যবাদ।';}else{document.getElementById('stock').innerHTML='<span class="bad">❌ '+displayName+' বর্তমানে স্টক আউট</span>';finalMessage='আসসালামু আলাইকুম।\n\nGerman Homeo Hall থেকে জানানো যাচ্ছে, আপনার চাহিদার ঔষধ "'+displayName+'" বর্তমানে স্টক আউট রয়েছে। ঔষধটি স্টকে এলে আপনাকে জানানো হবে।\n\nধন্যবাদ।';}finalPhone=cleanPhone(phone);document.getElementById('message').textContent=finalMessage;result.classList.remove('hide');status.textContent='মেসেজ প্রস্তুত হয়েছে।';status.className='ok'}function openWhatsApp(){if(!finalMessage||!finalPhone)return;window.open('https://wa.me/'+finalPhone+'?text='+encodeURIComponent(finalMessage),'_blank')}async function copyMessage(){if(!finalMessage)return;try{await navigator.clipboard.writeText(finalMessage);alert('মেসেজ কপি হয়েছে ✅')}catch(e){alert('কপি করা যায়নি। মেসেজটি চেপে ধরে কপি করুন।')}}loadMedicines();</script></body></html>
