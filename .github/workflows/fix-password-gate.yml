name: Fix password gate script placement
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair HTML script placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('medicine-manager.html')
          s=p.read_text(encoding='utf-8')
          guard="if(sessionStorage.getItem('ghh_password_ok')==='1'){showApp();}"
          s=s.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">\n          '+guard+'\n          </script>','<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>')
          s=s.replace('\n          '+guard+'\n          </script>','\n          </script>')
          if guard not in s:
              i=s.rfind('</script>')
              if i<0: raise SystemExit('no closing script tag')
              s=s[:i]+'\n'+guard+'\n'+s[i:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add medicine-manager.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Fix password gate placement'
          git push
