name: Patch typed medicine memo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update memo fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('medicine-manager.html')
          s=p.read_text(encoding='utf-8')
          old_css='.item{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:7px;margin-bottom:7px}'
          new_css='.item{display:grid;grid-template-columns:2fr .65fr 1fr .9fr .9fr 1fr auto;gap:7px;margin-bottom:7px}'
          s=s.replace(old_css,new_css)
          s=s.replace('<div class="full"><div id="items"></div><button type="button" class="secondary" onclick="addItem()">+ ওষুধ যোগ</button></div>', '<div class="full"><div style="overflow:auto"><div style="min-width:760px"><div style="display:grid;grid-template-columns:2fr .65fr 1fr .9fr .9fr 1fr auto;gap:7px;font-size:12px;font-weight:700;margin-bottom:5px"><span>ঔষধের নাম</span><span>পরিমাণ</span><span>দাম</span><span>জেনারেল %</span><span>এক্সট্রা %</span><span>নেট মোট</span><span></span></div><div id="items"></div></div></div><button type="button" class="secondary" onclick="addItem()">+ ওষুধ যোগ</button><div id="memoSummary" class="card" style="margin-top:10px;display:none"></div></div>')
          s=s.replace('<section id="memo" class="section"><div class="card"><h3>🧾 মেমো / রসিদ</h3>', '<section id="memo" class="section"><div class="card"><h3>🧾 মেমো / রসিদ</h3><p class="muted">ঔষধের নাম ঘরে সরাসরি লিখতে পারবেন। কমিশন না দিলে মেমোতে কমিশন দেখাবে না।</p>')
          add = '''function addItem(){
          const id='i'+Date.now()+Math.random().toString(36).slice(2);
          items.push(id);
          document.getElementById('items').insertAdjacentHTML('beforeend',`<div class="item" id="${id}"><input class="iname" placeholder="ঔষধের নাম লিখুন" oninput="calcItems()"><input class="iqty" type="number" min="1" value="1" oninput="calcItems()"><input class="iprice" type="number" min="0" step=".01" placeholder="দাম" oninput="calcItems()"><input class="igeneral" type="number" min="0" max="100" step=".01" placeholder="%" oninput="calcItems()"><input class="iextra" type="number" min="0" max="100" step=".01" placeholder="%" oninput="calcItems()"><span class="inet">৳0.00</span><button type="button" class="danger" onclick="this.parentElement.remove();calcItems()">✕</button></div>`);
          calcItems();
          }
          function calcItems(){
          let gross=0,general=0,extra=0,net=0,hasCommission=false;
          document.querySelectorAll('#items .item').forEach(r=>{const q=+r.querySelector('.iqty').value||0,p=+r.querySelector('.iprice').value||0,g=+r.querySelector('.igeneral').value||0,x=+r.querySelector('.iextra').value||0;const base=q*p,ga=base*g/100,after=base-ga,xa=after*x/100,n=after-xa;gross+=base;general+=ga;extra+=xa;net+=n;if(g||x)hasCommission=true;r.querySelector('.inet').textContent=money(n);});
          const box=document.getElementById('memoSummary');if(box){box.style.display=gross?'block':'none';box.innerHTML=hasCommission?`<div>মোট মূল টাকা: <b>${money(gross)}</b></div><div>জেনারেল কমিশন: <b>${money(general)}</b></div><div>এক্সট্রা কমিশন: <b>${money(extra)}</b></div><div class="right">নেট মেমো: ${money(net)}</div>`:`<div class="right">মোট টাকা: ${money(gross)}</div>`;}return {gross,general,extra,net,hasCommission};
          }
          function medicineByName(name){return meds.find(m=>(m.name||'').trim().toLowerCase()===(name||'').trim().toLowerCase());}
          '''
          s=re.sub(r'function addItem\(\)\{.*?(?=\nfunction )',add,s,count=1,flags=re.S)
          make = '''async function makeMemo(e){
          e.preventDefault();
          const rows=[...document.querySelectorAll('#items .item')];if(!rows.length)return alert('অন্তত একটি ঔষধ যোগ করুন।');
          const data=rows.map(r=>{const name=r.querySelector('.iname').value.trim(),q=+r.querySelector('.iqty').value||0,p=+r.querySelector('.iprice').value||0,g=+r.querySelector('.igeneral').value||0,x=+r.querySelector('.iextra').value||0;const base=q*p,ga=base*g/100,after=base-ga,xa=after*x/100;return{name,q,p,g,x,base,ga,xa,net:after-xa,m:medicineByName(name)}}).filter(x=>x.name&&x.q>0);
          if(!data.length)return alert('ঔষধের নাম লিখুন।');
          for(const x of data){if(x.m&&x.q>x.m.stock)return alert(`${x.name} — স্টক আছে ${x.m.stock} পিস, প্রয়োজন ${x.q} পিস।`);}
          const gross=data.reduce((a,x)=>a+x.base,0),general=data.reduce((a,x)=>a+x.ga,0),extra=data.reduce((a,x)=>a+x.xa,0),net=data.reduce((a,x)=>a+x.net,0),hasCommission=data.some(x=>x.g||x.x);
          const {data:last}=await SB.from('memos').select('serial_number').order('serial_number',{ascending:false}).limit(1);const serial=(last?.[0]?.serial_number||0)+1;
          const {data:mem,error}=await SB.from('memos').insert({shop_name:shop.value,customer_name:rn.value,customer_phone:rp.value,total:net,gross_total:gross,general_commission_amount:general,extra_commission_amount:extra,commission_enabled:hasCommission,commission_type:hasCommission?'per_item':'none',commission_value:general+extra,commission_mode:'percentage',paid:0,due:net,payment_method:'Cash',serial_number:serial}).select().single();if(error)return alert('মেমো সেভ হয়নি: '+error.message);
          for(const x of data){const {error:ie}=await SB.from('memo_items').insert({memo_id:mem.id,medicine_name:x.name,quantity:x.q,unit_price:x.p,total:x.net,mrp:x.p,commission_pct:x.g+x.x});if(ie)return alert('মেমোর আইটেম সেভ হয়নি: '+ie.message);if(x.m){await SB.from('medicines').update({stock:x.m.stock-x.q}).eq('id',x.m.id);await SB.from('sales').insert({medicine_id:x.m.id,medicine_name:x.m.name,quantity:x.q,unit_price:x.p,total:x.net,profit:x.q*(x.p-(+x.m.purchase_price||0)),customer_name:rn.value,customer_phone:rp.value,memo_id:mem.id,due:0});}}
          receipt.innerHTML=`<div class="receipt"><h2>German Homeo Hall</h2><div class="center">মেমো #${serial}<br>${rd.value}</div><p>ক্রেতা: ${esc(rn.value||'-')}<br>মোবাইল: ${esc(rp.value||'-')}</p><table><thead><tr><th>ঔষধ</th><th>Qty</th><th>দাম</th>${hasCommission?'<th>কমিশন</th>':''}<th>মোট</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.q}</td><td>${money(x.p)}</td>${hasCommission?`<td>${x.g||x.x?`${x.g?'G '+x.g+'%':''}${x.g&&x.x?' + ':''}${x.x?'E '+x.x+'%':''}`:'-'}</td>`:''}<td>${money(x.net)}</td></tr>`).join('')}</tbody></table><p class="right">${hasCommission?`মোট মূল টাকা: ${money(gross)}<br>জেনারেল কমিশন: -${money(general)}<br>এক্সট্রা কমিশন: -${money(extra)}<br><strong>নেট মেমো: ${money(net)}</strong>`:`<strong>মোট টাকা: ${money(net)}</strong>`}</p></div>`;
          receiptBox.style.display='block';await load();alert('✅ মেমো সেভ হয়েছে।');
          }
          '''
          s=re.sub(r'async function makeMemo\(e\)\{.*?(?=\nfunction )',make,s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add medicine-manager.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'মেমোতে ঔষধের নাম সরাসরি লেখার অপশন'
          git push
