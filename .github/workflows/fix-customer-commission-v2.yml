name: Fix customer commission UI formatting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('medicine-manager-password.html')
          s=p.read_text(encoding='utf-8')
          if 'CUSTOMER_PROFILE_COMMISSION_V2' not in s:
              raise SystemExit('base patch missing')
          s=s.replace('\\\\n','\n')
          marker='/* CUSTOMER_PROFILE_COMMISSION_V2 */'
          fix=r'''<script>\n/* CUSTOMER_PROFILE_COMMISSION_V2_FIX */\nwindow.toggleCommissionMode=function(){\n  const on=!!document.getElementById('commissionMode')?.checked;\n  const gc=document.getElementById('gcommission'),ec=document.getElementById('ecommission');\n  if(gc)gc.closest('label').style.display=on?'':'none';\n  if(ec)ec.closest('label').style.display=on?'':'none';\n  document.querySelectorAll('#items .icom').forEach(x=>{x.style.display=on?'':'none';if(!on)x.value=0});\n  const h=document.getElementById('commissionHelp');\n  if(h)h.innerHTML=on?'কমিশন চালু: General → অবশিষ্ট → Extra কমিশন হিসেবে হিসাব হবে।':'কমিশন বন্ধ: কোনো কমিশন কাটা হবে না; প্রতিটি ঔষধের TP/বিক্রয় মূল্যই মেমোর মূল্য হবে।';\n  if(typeof window._calcPreviewV2==='function')window._calcPreviewV2();\n  if(typeof window.calcMemoPreview==='function' && window.calcMemoPreview!==window._calcPreviewV2)window.calcMemoPreview();\n};\n</script>\n'''
          if 'CUSTOMER_PROFILE_COMMISSION_V2_FIX' not in s:
              s=s.replace('</body>',fix+'</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add medicine-manager-password.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix customer commission UI formatting'
          git push
