name: Add memo commission UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch memo page
        run: |
          python3 - <<'PY'
          p='medicine-manager-password.html'
          s=open(p,encoding='utf-8').read()
          if 'id="gcommission"' in s:
              print('already patched')
          else:
              s=s.replace('.item{display:grid;grid-template-columns:2fr .7fr 1fr auto;', '.item{display:grid;grid-template-columns:2fr .6fr 1fr 1fr .8fr auto;')
              s=s.replace('<div class="full"><div id="items"></div><button type="button" class="secondary" onclick="addItem()">+ ঔষধ যোগ করুন</button></div>', '<div class="full"><div class="muted">প্রতি লাইনে: ঔষধ • Qty • MRP • TP • কমিশন % • মোট</div><div id="items"></div><button type="button" class="secondary" onclick="addItem()">+ ঔষধ যোগ করুন</button></div><label>General Commission %<input id="gcommission" type="number" min="0" max="100" step=".01" value="0" oninput="calcMemoPreview()"></label><label>Extra Commission %<input id="ecommission" type="number" min="0" max="100" step=".01" value="0" oninput="calcMemoPreview()"></label><div class="full card" style="margin:0;background:#f7faf8"><b>কমিশন হিসাব</b><div id="commissionPreview" class="muted" style="margin-top:8px">মেমো তৈরি করলে হিসাব দেখাবে।</div></div>')
              old="function getMemoRows(){return [...document.querySelectorAll('#items .item')].map(r=>({name:r.querySelector('.iname').value.trim(),qty:+r.querySelector('.iqty').value||0,price:+r.querySelector('.iprice').value||0})).filter(x=>x.name&&x.qty)}"
              new="function getMemoRows(){return [...document.querySelectorAll('#items .item')].map(r=>({name:r.querySelector('.iname').value.trim(),qty:+r.querySelector('.iqty').value||0,mrp:+r.querySelector('.imrp').value||0,price:+r.querySelector('.iprice').value||0,commission_pct:+r.querySelector('.icom').value||0})).filter(x=>x.name&&x.qty)}\nfunction commissionCalc(rows){let gross=rows.reduce((a,x)=>a+x.qty*x.price,0),gp=Math.min(100,Math.max(0,+gcommission.value||0)),ga=gross*gp/100,after=gross-ga,ep=Math.min(100,Math.max(0,+ecommission.value||0)),ea=after*ep/100,net=after-ea;return {gross,gp,ga,after,ep,ea,net}}\nfunction calcMemoPreview(){let rows=getMemoRows();let c=commissionCalc(rows);commissionPreview.innerHTML=`মোট: <b>${money(c.gross)}</b> → General Commission (${c.gp}%): <b>${money(c.ga)}</b> → অবশিষ্ট: <b>${money(c.after)}</b> → Extra Commission (${c.ep}%): <b>${money(c.ea)}</b> → <b>মূল/নিট মেমো: ${money(c.net)}</b>`;return c}"
              s=s.replace(old,new)
              old="function addItem(){let id=Date.now()+Math.random();memoItems.push(id);let d=document.createElement('div');d.className='item';d.id='i'+id;d.innerHTML='<input class=\"iname\" placeholder=\"ঔষধের নাম\"><input class=\"iqty\" type=\"number\" min=\"1\" value=\"1\"><input class=\"iprice\" type=\"number\" min=\"0\" step=\".01\" placeholder=\"দাম\"><button type=\"button\" onclick=\"removeItem('+id+')\">×</button>';items.appendChild(d)}"
              new="function addItem(){let id=Date.now()+Math.random();memoItems.push(id);let d=document.createElement('div');d.className='item';d.id='i'+id;d.innerHTML='<input class=\"iname\" placeholder=\"ঔষধের নাম\"><input class=\"iqty\" type=\"number\" min=\"1\" value=\"1\" oninput=\"calcMemoPreview()\"><input class=\"imrp\" type=\"number\" min=\"0\" step=\".01\" placeholder=\"MRP\" oninput=\"calcMemoPreview()\"><input class=\"iprice\" type=\"number\" min=\"0\" step=\".01\" placeholder=\"TP\" oninput=\"calcMemoPreview()\"><input class=\"icom\" type=\"number\" min=\"0\" max=\"100\" step=\".01\" value=\"0\" placeholder=\"%\"><span class=\"lineTotal\" style=\"padding:11px;font-weight:800\">৳0</span><button type=\"button\" onclick=\"removeItem('+id+')\">×</button>';items.appendChild(d);d.querySelectorAll('input').forEach(x=>x.addEventListener('input',()=>{d.querySelector('.lineTotal').textContent=money((+d.querySelector('.iqty').value||0)*(+d.querySelector('.iprice').value||0));calcMemoPreview()}))}"
              s=s.replace(old,new)
              old="function makeMemo(e){e.preventDefault();let rows=getMemoRows();if(!rows.length)return alert('কমপক্ষে একটি ঔষধ যোগ করুন।');let total=rows.reduce((a,x)=>a+x.qty*x.price,0),paid=+rpaid.value||0;if(paid>total)return alert('Paid মোটের চেয়ে বেশি হতে পারবে না।');lastMemo={rows,total,paid,due:Math.max(0,total-paid),serial:null,shop:shop.value,date:rd.value,customer:rn.value,phone:rp.value};renderReceipt(lastMemo);receiptBox.classList.remove('hide');sellBtn.classList.remove('hide');receiptBox.scrollIntoView({behavior:'smooth'})}"
              new="function makeMemo(e){e.preventDefault();let rows=getMemoRows();if(!rows.length)return alert('কমপক্ষে একটি ঔষধ যোগ করুন।');let c=commissionCalc(rows),paid=+rpaid.value||0;if(paid>c.net)return alert('Paid মূল/নিট মেমোর চেয়ে বেশি হতে পারবে না।');lastMemo={rows,total:c.net,grossTotal:c.gross,gp:c.gp,ga:c.ga,afterGeneral:c.after,ep:c.ep,ea:c.ea,paid,due:Math.max(0,c.net-paid),serial:null,shop:shop.value,date:rd.value,customer:rn.value,phone:rp.value};renderReceipt(lastMemo);receiptBox.classList.remove('hide');sellBtn.classList.remove('hide');receiptBox.scrollIntoView({behavior:'smooth'})}"
              s=s.replace(old,new)
              old="function renderReceipt(m){receipt.innerHTML=`<div class=\"receipt\" id=\"printable\"><h2>${esc(m.shop||'German Homeo Hall')}</h2><div class=\"center\">Medicine Memo / Receipt<br><b class=\"memoSerial\">Memo Serial: #${esc(m.serial||'সেল করুন')}</b><br>তারিখ: ${esc(m.date||today())}</div><p>ক্রেতা: ${esc(m.customer||'-')}<br>মোবাইল: ${esc(m.phone||'-')}</p><table><thead><tr><th>ঔষধ</th><th>Qty</th><th>দাম</th><th>মোট</th></tr></thead><tbody>${m.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</tbody></table><p class=\"right\">সর্বমোট: ${money(m.total)}<br>Paid: ${money(m.paid)}<br><span class=\"${m.due?'red':''}\">Due: ${money(m.due)}</span></p><p class=\"center muted\">ধন্যবাদ — German Homeo Hall</p></div>`}"
              new="function renderReceipt(m){receipt.innerHTML=`<div class=\"receipt\" id=\"printable\"><h2>${esc(m.shop||'German Homeo Hall')}</h2><div class=\"center\">Medicine Memo / Receipt<br><b class=\"memoSerial\">Memo Serial: #${esc(m.serial||'সেল করুন')}</b><br>তারিখ: ${esc(m.date||today())}</div><p>ক্রেতা: ${esc(m.customer||'-')}<br>মোবাইল: ${esc(m.phone||'-')}</p><table><thead><tr><th>ঔষধ</th><th>Qty</th><th>MRP</th><th>TP</th><th>কমিশন %</th><th>মোট</th></tr></thead><tbody>${m.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.mrp||0)}</td><td>${money(x.price)}</td><td>${x.commission_pct||0}%</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</tbody></table><p class=\"right\">সর্বমোট: ${money(m.grossTotal??m.total)}<br>General Commission (${m.gp||0}%): ${money(m.ga||0)}<br>General Commission-এর পর: ${money(m.afterGeneral??(m.grossTotal??m.total))}<br>Extra Commission (${m.ep||0}%): ${money(m.ea||0)}<br><b>মূল/নিট মেমো: ${money(m.total)}</b><br>Paid: ${money(m.paid)}<br><span class=\"${m.due?'red':''}\">Due: ${money(m.due)}</span></p><p class=\"center muted\">ধন্যবাদ — German Homeo Hall</p></div>`}"
              s=s.replace(old,new)
              old="async function sellMemo(){if(!lastMemo)return alert('আগে মেমো তৈরি করুন।');let m=lastMemo;sellBtn.disabled=true;let {data,error}=await SB.rpc('save_memo_transaction',{p_shop_name:m.shop,p_customer_name:m.customer,p_customer_phone:m.phone,p_total:m.total,p_paid:m.paid,p_due:m.due,p_payment_method:rpay.value,p_note:'Saved from memo',p_items:m.rows});sellBtn.disabled=false;if(error)return alert('মেমো সেভ হয়নি: '+error.message);let saved=(await SB.from('memos').select('*').eq('id',data).single()).data;if(saved){lastMemo.serial=saved.serial_number;lastMemo.date=iso(saved.created_at);renderReceipt(lastMemo)}await load();sellBtn.classList.add('hide');alert(`✅ সেল সম্পন্ন। মেমো #${saved?.serial_number||data} সেভ হয়েছে।${m.due>0?' বাকি রাখা হয়েছে।':''}`)}"
              new="async function sellMemo(){if(!lastMemo)return alert('আগে মেমো তৈরি করুন।');let m=lastMemo;sellBtn.disabled=true;let {data,error}=await SB.rpc('save_memo_transaction',{p_shop_name:m.shop,p_customer_name:m.customer,p_customer_phone:m.phone,p_total:m.total,p_paid:m.paid,p_due:m.due,p_payment_method:rpay.value,p_note:'Saved from memo',p_items:m.rows});sellBtn.disabled=false;if(error)return alert('মেমো সেভ হয়নি: '+error.message);await SB.from('memos').update({gross_total:m.grossTotal,general_commission_pct:m.gp,general_commission_amount:m.ga,extra_commission_pct:m.ep,extra_commission_amount:m.ea}).eq('id',data);let its=(await SB.from('memo_items').select('*').eq('memo_id',data).order('id')).data||[];for(let i=0;i<its.length&&i<m.rows.length;i++){await SB.from('memo_items').update({mrp:m.rows[i].mrp||0,commission_pct:m.rows[i].commission_pct||0}).eq('id',its[i].id)}let saved=(await SB.from('memos').select('*').eq('id',data).single()).data;if(saved){lastMemo.serial=saved.serial_number;lastMemo.date=iso(saved.created_at);renderReceipt(lastMemo)}await load();sellBtn.classList.add('hide');alert(`✅ সেল সম্পন্ন। মেমো #${saved?.serial_number||data} সেভ হয়েছে।${m.due>0?' বাকি রাখা হয়েছে।':''}`)}"
              s=s.replace(old,new)
              old="async function viewMemo(id){let m=memos.find(x=>x.id==id);if(!m)return;let {data,error}=await SB.from('memo_items').select('*').eq('memo_id',id).order('id');if(error)return alert(error.message);lastMemo={rows:(data||[]).map(x=>({name:x.medicine_name,qty:x.quantity,price:x.unit_price})),total:+m.total||0,paid:+m.paid||0,due:+m.due||0,serial:m.serial_number,shop:m.shop_name||'German Homeo Hall',date:iso(m.created_at),customer:m.customer_name||'',phone:m.customer_phone||''};renderReceipt(lastMemo);receiptBox.classList.remove('hide');receiptBox.scrollIntoView({behavior:'smooth'})}"
              new="async function viewMemo(id){let m=memos.find(x=>x.id==id);if(!m)return;let {data,error}=await SB.from('memo_items').select('*').eq('memo_id',id).order('id');if(error)return alert(error.message);lastMemo={rows:(data||[]).map(x=>({name:x.medicine_name,qty:x.quantity,price:x.unit_price,mrp:+x.mrp||0,commission_pct:+x.commission_pct||0})),total:+m.total||0,grossTotal:+m.gross_total||+m.total||0,gp:+m.general_commission_pct||0,ga:+m.general_commission_amount||0,afterGeneral:(+m.gross_total||+m.total||0)-(+m.general_commission_amount||0),ep:+m.extra_commission_pct||0,ea:+m.extra_commission_amount||0,paid:+m.paid||0,due:+m.due||0,serial:m.serial_number,shop:m.shop_name||'German Homeo Hall',date:iso(m.created_at),customer:m.customer_name||'',phone:m.customer_phone||''};renderReceipt(lastMemo);receiptBox.classList.remove('hide');receiptBox.scrollIntoView({behavior:'smooth'})}"
              s=s.replace(old,new)
              s=s.replace("function memoShareText(){", "function memoShareText(){")
              open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add medicine-manager-password.html
          git rm .github/workflows/add-memo-commission.yml
          git commit -m 'Add MRP TP and percentage commission to memos'
          git push
