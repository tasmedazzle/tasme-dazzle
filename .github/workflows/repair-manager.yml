name: Repair Medicine Manager
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore working manager
        run: |
          git fetch --all --quiet
          git checkout 9ab169fd44ce21430e123181a7e4c3e63f2094da -- medicine-manager-password.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add medicine-manager-password.html
          git commit -m 'Repair broken manager page' || true
          git push
      - name: Remove repair workflow
        run: |
          git rm .github/workflows/repair-manager.yml || true
          git commit -m 'Remove temporary repair workflow' || true
          git push || true
