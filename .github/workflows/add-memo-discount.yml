name: Add memo commission discount
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-memo-discount.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch memo discount
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('medicine-manager-password.html')
          s=p.read_text(encoding='utf-8')
          old='<label>Paid<input id="rpaid" type="number" min="0" step=".01" value="0"></label><label>Payment<select id="rpay">'
          new='<label>Paid<input id="rpaid" type="number" min="0" step=".01" value="0"></label><label>কমিশন / ডিসকাউন্ট (৳)<input id="rdiscount" type="number" min="0" step=".01" value="0" placeholder="টোটালের উপর ছাড়"></label><label>Payment<select id="rpay">'
          if old not in s: raise SystemExit('form marker not found')
          s=s.replace(old,new,1)
          old='function makeMemo(e){e.preventDefault();let rows=getMemoRows();if(!rows.length)return alert(\'কমপক্ষে একটি ঔষধ যোগ করুন।\');let total=rows.reduce((a,x)=>a+x.qty*x.price,0),paid=+rpaid.value||0;if(paid>total)return alert(\'Paid মোটের চেয়ে বেশি হতে পারবে না।\');lastMemo={rows,total,paid,due:Math.max(0,total-paid),serial:null,shop:shop.value,date:rd.value,customer:rn.value,phone:rp.value};'
          new='function makeMemo(e){e.preventDefault();let rows=getMemoRows();if(!rows.length)return alert(\'কমপক্ষে একটি ঔষধ যোগ করুন।\');let gross=rows.reduce((a,x)=>a+x.qty*x.price,0),discount=Math.max(0,+rdiscount.value||0);if(discount>gross)return alert(\'কমিশন / ডিসকাউন্ট টোটালের চেয়ে বেশি হতে পারবে না।\');let total=Math.max(0,gross-discount),paid=+rpaid.value||0;if(paid>total)return alert(\'Paid ডিসকাউন্টের পরের টোটালের চেয়ে বেশি হতে পারবে না।\');lastMemo={rows,gross,discount,total,paid,due:Math.max(0,total-paid),serial:null,shop:shop.value,date:rd.value,customer:rn.value,phone:rp.value};'
          if old not in s: raise SystemExit('makeMemo marker not found')
          s=s.replace(old,new,1)
          old='function renderReceipt(m){receipt.innerHTML=`<div class="receipt" id="printable"><h2>${esc(m.shop||\'German Homeo Hall\')}</h2><div class="center">Medicine Memo / Receipt<br><b class="memoSerial">Memo Serial: #${esc(m.serial||\'সেল করুন\')}</b><br>তারিখ: ${esc(m.date||today())}</div><p>ক্রেতা: ${esc(m.customer||\'-\')}<br>মোবাইল: ${esc(m.phone||\'-\')}</p><table>'
          new='function renderReceipt(m){receipt.innerHTML=`<div class="receipt" id="printable"><h2>${esc(m.shop||\'German Homeo Hall\')}</h2><div class="center">Medicine Memo / Receipt<br><b class="memoSerial">Memo Serial: #${esc(m.serial||\'সেল করুন\')}</b><br>তারিখ: ${esc(m.date||today())}</div><p>ক্রেতা: ${esc(m.customer||\'-\')}<br>মোবাইল: ${esc(m.phone||\'-\')}</p><table>'
          if old not in s: raise SystemExit('receipt start marker not found')
          s=s.replace(old,new,1)
          old='<p class="right">সর্বমোট: ${money(m.total)}<br>Paid: ${money(m.paid)}<br><span class="${m.due?\'red\':\'\'}">Due: ${money(m.due)}</span></p>'
          new='<p class="right">সর্বমোট: ${money(m.gross??m.total)}${m.discount?`<br>কমিশন / ডিসকাউন্ট: -${money(m.discount)}`:``}<br><b>নিট টোটাল: ${money(m.total)}</b><br>Paid: ${money(m.paid)}<br><span class="${m.due?\'red\':\'\'}">Due: ${money(m.due)}</span></p>'
          if old not in s: raise SystemExit('receipt total marker not found')
          s=s.replace(old,new,1)
          old='let m=lastMemo;return `${m.shop||\'German Homeo Hall\'}\\n🧾 মেমো #${m.serial||\'—\'}\\nতারিখ: ${m.date||today()}\\nক্রেতা: ${m.customer||\'-\'}\\nমোবাইল: ${m.phone||\'-\'}\\n\\n${m.rows.map(x=>`${x.name} × ${x.qty} = ${money(x.qty*x.price)}`).join(\'\\n\')}\\n\\nসর্বমোট: ${money(m.total)}\\nPaid: ${money(m.paid)}\\nবাকি: ${money(m.due)}\\n\\nধন্যবাদ — ${m.shop||\'German Homeo Hall\'}`}'
          new='let m=lastMemo;return `${m.shop||\'German Homeo Hall\'}\\n🧾 মেমো #${m.serial||\'—\'}\\nতারিখ: ${m.date||today()}\\nক্রেতা: ${m.customer||\'-\'}\\nমোবাইল: ${m.phone||\'-\'}\\n\\n${m.rows.map(x=>`${x.name} × ${x.qty} = ${money(x.qty*x.price)}`).join(\'\\n\')}\\n\\nসর্বমোট: ${money(m.gross??m.total)}${m.discount?`\\nকমিশন / ডিসকাউন্ট: -${money(m.discount)}`:\'\'}\\nনিট টোটাল: ${money(m.total)}\\nPaid: ${money(m.paid)}\\nবাকি: ${money(m.due)}\\n\\nধন্যবাদ — ${m.shop||\'German Homeo Hall\'}`}'
          if old not in s: raise SystemExit('share marker not found')
          s=s.replace(old,new,1)
          old='lastMemo={rows:(data||[]).map(x=>({name:x.medicine_name,qty:x.quantity,price:x.unit_price})),total:+m.total||0,paid:+m.paid||0,due:+m.due||0,serial:m.serial_number,shop:m.shop_name||\'German Homeo Hall\',date:iso(m.created_at),customer:m.customer_name||\'\',phone:m.customer_phone||\'\'};'
          new='lastMemo={rows:(data||[]).map(x=>({name:x.medicine_name,qty:x.quantity,price:x.unit_price})),gross:(+m.total||0)+(+m.discount||0),discount:+m.discount||0,total:+m.total||0,paid:+m.paid||0,due:+m.due||0,serial:m.serial_number,shop:m.shop_name||\'German Homeo Hall\',date:iso(m.created_at),customer:m.customer_name||\'\',phone:m.customer_phone||\'\'};'
          if old not in s: raise SystemExit('viewMemo marker not found')
          s=s.replace(old,new,1)
          old='let saved=(await SB.from(\'memos\').select(\'*\').eq(\'id\',data).single()).data;if(saved){lastMemo.serial=saved.serial_number;lastMemo.date=iso(saved.created_at);renderReceipt(lastMemo)}'
          new='let saved=(await SB.from(\'memos\').select(\'*\').eq(\'id\',data).single()).data;if(saved){await SB.from(\'memos\').update({discount:m.discount||0}).eq(\'id\',data);saved.discount=m.discount||0;lastMemo.serial=saved.serial_number;lastMemo.date=iso(saved.created_at);renderReceipt(lastMemo)}'
          if old not in s: raise SystemExit('save marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add medicine-manager-password.html
          git commit -m "Add memo commission discount option" || true
          git push
          rm -f .github/workflows/add-memo-discount.yml
          git add .github/workflows/add-memo-discount.yml
          git commit -m "Remove temporary memo discount workflow" || true
          git push