name: Make manager password only
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace email login with password gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('medicine-manager.html')
          s=p.read_text(encoding='utf-8')
          old=re.search(r'<div id="login" class="wrap login">.*?</div>\s*<div id="app"',s,re.S)
          new='''<div id="login" class="wrap login"><div class="card"><h2>🔐 GHH SmartBiz</h2><p class="muted">আপনার ব্যবসার স্টক, মেমো, কাস্টমার ও হিসাব এক জায়গায়।</p><label>পাসওয়ার্ড<input id="password" type="password" placeholder="পাসওয়ার্ড লিখুন" autocomplete="current-password" onkeydown="if(event.key==='Enter') login()"></label><button class="primary" onclick="login()">লগইন</button><p id="authmsg"></p></div></div><div id="app"'''
          if old:
              s=s[:old.start()]+new+s[old.end():]
          else:
              raise SystemExit('login block not found')
          s=re.sub(r'async function signup\(\)\{.*?\}\s*async function login\(\)\{.*?\}\s*async function logout\(\)\{.*?\}\s*async function init\(user\)\{', '''function login(){\n          const p=document.getElementById('password').value;\n          const msg=document.getElementById('authmsg');\n          if(p!=='drgp@@123'){msg.textContent='❌ পাসওয়ার্ড সঠিক নয়।';return;}\n          sessionStorage.setItem('ghh_password_ok','1');\n          showApp();\n          }\n          function logout(){sessionStorage.removeItem('ghh_password_ok');location.reload();}\n          function showApp(){\n          document.getElementById('login').style.display='none';\n          document.getElementById('app').style.display='block';\n          const who=document.getElementById('who'); if(who) who.textContent='পাসওয়ার্ড দিয়ে লগইন করা হয়েছে';\n          const rd=document.getElementById('rd'); if(rd) rd.value=new Date().toISOString().slice(0,10);\n          load();\n          }\n          function init(user){''',s,count=1,flags=re.S)
          s=s.replace("who.textContent='লগইন: '+user.email;rd.value=new Date().toISOString().slice(0,10);await load()","who.textContent='পাসওয়ার্ড দিয়ে লগইন করা হয়েছে';rd.value=new Date().toISOString().slice(0,10);await load()")
          s=s.replace("<p class=\"muted\">একই অ্যাকাউন্ট দিয়ে একাধিক ডিভাইসে ব্যবহার করুন।</p>","")
          marker='</script>'
          guard="""\n          if(sessionStorage.getItem('ghh_password_ok')==='1'){showApp();}\n          """
          if guard.strip() not in s:
              s=s.replace(marker,guard+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add medicine-manager.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'পাসওয়ার্ড দিয়ে ম্যানেজার লগইন'
          git push
