name: Finalize customer profile UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize generated JavaScript
        shell: python
        run: |
          from pathlib import Path
          p=Path('medicine-manager-password.html')
          s=p.read_text(encoding='utf-8')
          if 'CUSTOMER_PROFILE_COMMISSION_V2' not in s:
              raise SystemExit('patch marker missing')
          s=s.replace('\\n', '\n')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add medicine-manager-password.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize customer profile and commission UI'
          git push
