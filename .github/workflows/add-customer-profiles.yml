name: Add customer profiles
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-customer-profiles.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch manager
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('medicine-manager-password.html')
          s=p.read_text(encoding='utf-8')
          marker='/* GHH CUSTOMER PROFILES V2 */'
          if marker in s:
              print('already patched')
              raise SystemExit
          css='''<style id="ghhCustomerCss">#customer .profileGrid{display:grid;grid-template-columns:1fr 1.5fr;gap:14px}#customer .profileList{max-height:520px;overflow:auto}.profileCard{border:1px solid #e2e9e4;border-radius:12px;padding:12px;margin:8px 0;background:#fbfdfb}.profileCard b{font-size:15px}.profileCard small{color:#66746d}.profileHead{display:flex;justify-content:space-between;gap:8px;align-items:center}.profileStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.profileStat{background:#f5f8f6;border-radius:10px;padding:10px}.profileStat b{display:block;margin-top:4px}.profileMemo{border-top:1px solid #edf1ee;padding:9px 0}.commissionBox{background:#fffaf0;border:1px solid #f0dfb3;border-radius:10px;padding:10px;margin-top:8px}@media(max-width:700px){#customer .profileGrid{grid-template-columns:1fr}.profileStats{grid-template-columns:1fr 1fr}}#memo .commissionMode{background:#f7faf8;border:1px solid #dfe8e2;border-radius:12px;padding:12px;margin-top:10px}</style>'''
          html='''<div id="customerEnhanced" class="profileGrid"><div><div class="card" style="margin:0"><h2>👤 নিয়মিত কাস্টমার</h2><p class="muted">দোকানের নাম বা মোবাইল দিয়ে খুঁজুন।</p><input id="cpSearch" placeholder="দোকানের নাম / মোবাইল দিয়ে সার্চ..." oninput="renderCustomerProfiles()"><div class="actions" style="margin-top:8px"><button class="primary" onclick="newCustomerProfile()">➕ নতুন প্রোফাইল</button></div></div><div id="cpList" class="profileList"></div></div><div><div id="cpDetail" class="card" style="margin:0"><h3>👤 প্রোফাইল নির্বাচন করুন</h3><p class="muted">বাম পাশ থেকে কোনো কাস্টমার নির্বাচন করুন। এখানে তার মেমো, কেনাকাটা, বাকি ও পেমেন্টের হিসাব দেখা যাবে।</p></div></div></div>'''
          s=s.replace('</body>',css+html+'</body>')
          js=r'''<script>/* GHH CUSTOMER PROFILES V2 */
          const _ghhTab=window.tab;
          window.tab=function(id,b){_ghhTab(id,b);if(id==='customer')loadCustomerProfiles();};
          const _ghhInit=window.init;
          window.init=async function(){await _ghhInit();setTimeout(()=>{loadCustomerProfiles();enhanceMemoUI();},150);};
          function enhanceMemoUI(){
            if(!document.querySelector('#memo .commissionMode')){
              const form=document.querySelector('#memo form');
              if(form){
                const old=document.getElementById('rdiscount'); if(old){const lab=old.closest('label');if(lab)lab.style.display='none';}
                const rn=document.getElementById('rn');
                if(rn){const lab=rn.closest('label'); if(lab&&!document.getElementById('memoCustomerProfile')){const box=document.createElement('div');box.className='commissionMode full';box.innerHTML='<label>👤 কাস্টমার প্রোফাইল<select id="memoCustomerProfile"><option value="">নতুন/সাধারণ কাস্টমার</option></select></label><div class="muted" style="margin-top:6px">প্রোফাইল বাছাই করলে নাম ও মোবাইল অটো বসবে।</div>';lab.insertAdjacentElement('afterend',box);}}
              }
            }
            loadCustomerSelect();
          }
          async function loadCustomerProfiles(){
            const {data,error}=await SB.from('customer_profiles').select('*').order('shop_name');
            if(error){console.error(error);return}
            window.customerProfiles=data||[];renderCustomerProfiles();loadCustomerSelect();
          }
          function renderCustomerProfiles(){
            const el=document.getElementById('cpList'); if(!el)return; const q=(document.getElementById('cpSearch')?.value||'').toLowerCase().trim();
            const arr=(window.customerProfiles||[]).filter(c=>(c.shop_name+' '+(c.mobile||'')).toLowerCase().includes(q));
            el.innerHTML=arr.map(c=>`<div class="profileCard" onclick="openCustomerProfile(${c.id})"><div class="profileHead"><b>${esc(c.shop_name)}</b><button type="button" class="secondary" onclick="event.stopPropagation();openCustomerProfile(${c.id})">খুলুন</button></div><small>📱 ${esc(c.mobile||'মোবাইল নেই')}</small></div>`).join('')||'<div class="card">কোনো কাস্টমার পাওয়া যায়নি।</div>';
          }
          async function loadCustomerSelect(){
            const sel=document.getElementById('memoCustomerProfile');if(!sel)return; const cur=sel.value; sel.innerHTML='<option value="">নতুন/সাধারণ কাস্টমার</option>'+(window.customerProfiles||[]).map(c=>`<option value="${c.id}">${esc(c.shop_name)}${c.mobile?' — '+esc(c.mobile):''}</option>`).join('');sel.value=cur;
            sel.onchange=()=>{const c=(window.customerProfiles||[]).find(x=>String(x.id)===String(sel.value));if(c){rn.value=c.shop_name||'';rp.value=c.mobile||'';}};
          }
          async function newCustomerProfile(){
            const name=prompt('দোকানের নাম / কাস্টমারের নাম লিখুন:');if(!name?.trim())return;const mobile=prompt('মোবাইল নম্বর (ঐচ্ছিক):')||'';const address=prompt('ঠিকানা (ঐচ্ছিক):')||'';
            const {data,error}=await SB.from('customer_profiles').insert({shop_name:name.trim(),mobile:mobile.trim(),address}).select().single();if(error)return alert('প্রোফাইল তৈরি হয়নি: '+error.message);await loadCustomerProfiles();openCustomerProfile(data.id);
          }
          async function openCustomerProfile(id){
            const c=(window.customerProfiles||[]).find(x=>x.id==id);if(!c)return;const {data,error}=await SB.from('memos').select('*').eq('customer_id',id).order('created_at',{ascending:false});if(error)return alert(error.message);const ms=data||[];const total=ms.reduce((a,m)=>a+(+m.total||0),0),paid=ms.reduce((a,m)=>a+(+m.paid||0),0),due=ms.reduce((a,m)=>a+(+m.due||0),0);
            cpDetail.innerHTML=`<div class="profileHead"><div><h2 style="margin:0">👤 ${esc(c.shop_name)}</h2><div class="muted">📱 ${esc(c.mobile||'-')} ${c.address?' • 📍 '+esc(c.address):''}</div></div><button class="secondary" onclick="newMemoForCustomer(${c.id})">🧾 নতুন মেমো</button></div><div class="profileStats"><div class="profileStat">মোট কেনা<b>${money(total)}</b></div><div class="profileStat">মোট পরিশোধ<b class="green">${money(paid)}</b></div><div class="profileStat">বর্তমান বাকি<b class="${due?'red':''}">${money(due)}</b></div></div><h3>🧾 মেমো ও লেনদেন</h3>${ms.map(m=>`<div class="profileMemo"><b>#${m.serial_number}</b> — ${new Date(m.created_at).toLocaleDateString('bn-BD')}<br>মোট ${money(m.total)} • Paid ${money(m.paid)} • <span class="${+m.due?'red':'green'}">বাকি ${money(m.due)}</span>${+m.due?` <button class="primary" onclick="openPayment(${m.serial_number})">💰 পরিশোধ</button>`:''} <button class="secondary" onclick="viewMemo(${m.id})">দেখুন</button></div>`).join('')||'<p class="muted">এখনও কোনো মেমো নেই।</p>'}`;
          }
          function newMemoForCustomer(id){tab('memo',document.querySelector('nav button[onclick*="memo"]'));setTimeout(()=>{if(document.getElementById('memoCustomerProfile')){memoCustomerProfile.value=String(id);memoCustomerProfile.dispatchEvent(new Event('change'));}},100);}
          const _oldMakeMemo=window.makeMemo;
          window.makeMemo=function(e){
            e.preventDefault(); const rows=getMemoRows();if(!rows.length)return alert('কমপক্ষে একটি ঔষধ যোগ করুন।'); const c=commissionCalc(rows);const paid=+rpaid.value||0;if(paid>c.net)return alert('Paid নিট টোটালের চেয়ে বেশি হতে পারবে না.'); const prof=document.getElementById('memoCustomerProfile');const cid=prof?.value||null;lastMemo={rows,gross:c.gross,gp:c.gp,ga:c.ga,after:c.after,ep:c.ep,ea:c.ea,net:c.net,total:c.net,paid,due:Math.max(0,c.net-paid),serial:null,shop:shop.value,date:rd.value,customer:rn.value,phone:rp.value,customer_id:cid,commission_mode:(c.gp||c.ep)?'percentage':'none'};renderReceipt(lastMemo);receiptBox.classList.remove('hide');sellBtn.classList.remove('hide');receiptBox.scrollIntoView({behavior:'smooth'});
          };
          window.renderReceipt=function(m){receipt.innerHTML=`<div class="receipt" id="printable"><h2>${esc(m.shop||'German Homeo Hall')}</h2><div class="center">Medicine Memo / Receipt<br><b class="memoSerial">Memo Serial: #${esc(m.serial||'সেল করুন')}</b><br>তারিখ: ${esc(m.date||today())}</div><p>কাস্টমার/দোকান: ${esc(m.customer||'-')}<br>মোবাইল: ${esc(m.phone||'-')}</p><table><thead><tr><th>ঔষধ</th><th>Qty</th><th>MRP</th><th>TP</th><th>কমিশন %</th><th>মোট</th></tr></thead><tbody>${m.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.mrp)}</td><td>${money(x.price)}</td><td>${x.commission_pct||0}%</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</tbody></table><div class="commissionBox"><b>কমিশন হিসাব</b><br>Gross: ${money(m.gross)}<br>General Commission (${m.gp||0}%): -${money(m.ga||0)}<br>অবশিষ্ট: ${money(m.after??m.gross)}<br>Extra Commission (${m.ep||0}%): -${money(m.ea||0)}<br><b>মূল/নিট মেমো: ${money(m.net??m.total)}</b></div><p class="right">Paid: ${money(m.paid)}<br><span class="${m.due?'red':''}">Due: ${money(m.due)}</span></p><p class="center muted">ধন্যবাদ — German Homeo Hall</p></div>`};
          window.sellMemo=async function(){if(!lastMemo)return alert('আগে মেমো তৈরি করুন।');let m=lastMemo;sellBtn.disabled=true;let {data,error}=await SB.rpc('save_memo_transaction',{p_shop_name:m.shop,p_customer_name:m.customer,p_customer_phone:m.phone,p_total:m.total,p_paid:m.paid,p_due:m.due,p_payment_method:rpay.value,p_note:'Saved from memo',p_items:m.rows});if(error){sellBtn.disabled=false;return alert('মেমো সেভ হয়নি: '+error.message)}let id=data;let updates={gross_total:m.gross,general_commission_pct:m.gp||0,general_commission_amount:m.ga||0,extra_commission_pct:m.ep||0,extra_commission_amount:m.ea||0,commission_mode:m.commission_mode||'none',commission_value:(m.ga||0)+(m.ea||0)};if(m.customer_id)updates.customer_id=+m.customer_id;await SB.from('memos').update(updates).eq('id',id);let {data:mi}=await SB.from('memo_items').select('*').eq('memo_id',id).order('id');if(mi)for(let i=0;i<Math.min(mi.length,m.rows.length);i++)await SB.from('memo_items').update({mrp:m.rows[i].mrp||0,commission_pct:m.rows[i].commission_pct||0}).eq('id',mi[i].id);let saved=(await SB.from('memos').select('*').eq('id',id).single()).data;sellBtn.disabled=false;if(saved){lastMemo.serial=saved.serial_number;lastMemo.date=iso(saved.created_at);renderReceipt(lastMemo)}await load();await loadCustomerProfiles();sellBtn.classList.add('hide');alert(`✅ সেল সম্পন্ন। মেমো #${saved?.serial_number||id} সেভ হয়েছে।${m.due>0?' বাকি রাখা হয়েছে।':''}`)};
          </script>'''
          s=s.replace('</body>',js+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add medicine-manager-password.html .github/workflows/add-customer-profiles.yml
          git commit -m 'Add customer profiles and memo commission controls' || true
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/add-customer-profiles.yml
          git commit -m 'Remove temporary customer profile workflow'
          git push
