name: Add customer profiles and commission UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch manager
        shell: python
        run: |
          from pathlib import Path
          p=Path('medicine-manager-password.html')
          s=p.read_text(encoding='utf-8')
          if 'CUSTOMER_PROFILE_COMMISSION_V2' in s:
              print('Already patched')
              raise SystemExit(0)
          patch=r'''<style id="CUSTOMER_PROFILE_COMMISSION_V2">\n.customerPanel{margin-top:14px}.profileHead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.profileCard{border:1px solid #e5ebe7;border-radius:14px;padding:14px;margin:10px 0;background:#fff}.profileStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.profileStat{background:#f7faf8;border-radius:10px;padding:10px}.profileStat b{display:block;font-size:18px;margin-top:4px}@media(max-width:600px){.profileStats{grid-template-columns:1fr 1fr}}\n</style><script>\n/* CUSTOMER_PROFILE_COMMISSION_V2 */\nlet activeCustomerId=null;\nfunction commissionModeUI(){\n  if(document.getElementById('commissionMode')) return;\n  const gc=document.getElementById('gcommission'),ec=document.getElementById('ecommission');\n  if(!gc||!ec)return;\n  const box=document.createElement('div'); box.className='full card'; box.style.margin='0';\n  box.innerHTML='<b>💰 কমিশন অপশন</b><label style="display:flex;align-items:center;gap:8px;margin-top:10px"><input id="commissionMode" type="checkbox" style="width:auto;margin:0" onchange="toggleCommissionMode()"> এই মেমোতে কমিশন দিতে চাই</label><div id="commissionHelp" class="muted" style="margin-top:6px">কমিশন না দিলে TP/বিক্রয় মূল্য আপনি নিজে লিখবেন।</div>';\n  gc.closest('label').before(box); toggleCommissionMode();\n}\nfunction toggleCommissionMode(){\n  const on=!!document.getElementById('commissionMode')?.checked;\n  const gc=document.getElementById('gcommission'),ec=document.getElementById('ecommission');\n  if(gc)gc.closest('label').style.display=on?'':'none'; if(ec)ec.closest('label').style.display=on?'':'none';\n  document.querySelectorAll('#items .icom').forEach(x=>{x.closest('div').style.display=on?'':'none'; if(!on)x.value=0});\n  const h=document.getElementById('commissionHelp'); if(h)h.innerHTML=on?'কমিশন চালু: General → অবশিষ্ট → Extra কমিশন হিসেবে হিসাব হবে।':'কমিশন বন্ধ: কোনো কমিশন কাটা হবে না; প্রতিটি ঔষধের TP/বিক্রয় মূল্যই মেমোর মূল্য হবে।';\n  calcMemoPreview();\n}\nfunction ensureCustomerUI(){\n  const sec=document.getElementById('customer'); if(!sec||document.getElementById('customerV2'))return;\n  const old=sec.querySelector('.card'); if(old)old.classList.add('hide');\n  const box=document.createElement('div');box.id='customerV2';box.innerHTML=`<div class="card"><div class="profileHead"><div><h2>👤 নিয়মিত ক্রেতার প্রোফাইল</h2><p class="muted">দোকানের নাম / ক্রেতার নাম / মোবাইল দিয়ে সার্চ করুন।</p></div><button class="primary" onclick="newCustomerProfile()">➕ নতুন প্রোফাইল</button></div><div class="searchRow"><input id="customerSearchV2" oninput="renderCustomerProfiles()" placeholder="দোকানের নাম / নাম / মোবাইল দিয়ে সার্চ..."><button class="secondary" onclick="renderCustomerProfiles()">🔎 সার্চ</button><button onclick="loadCustomerProfiles()">🔄 Refresh</button></div><div id="customerListV2"></div></div><div id="customerProfileV2" class="card hide"></div>`;sec.appendChild(box);\n  loadCustomerProfiles();\n}\nasync function loadCustomerProfiles(){\n  const {data,error}=await SB.from('customers').select('*').order('updated_at',{ascending:false});\n  if(error)return alert('ক্রেতা লোড হয়নি: '+error.message); window.customerProfiles=data||[]; renderCustomerProfiles();\n}\nfunction renderCustomerProfiles(){\n  const q=(document.getElementById('customerSearchV2')?.value||'').toLowerCase().trim();\n  const arr=(window.customerProfiles||[]).filter(c=>[c.shop_name,c.customer_name,c.phone].join(' ').toLowerCase().includes(q));\n  const el=document.getElementById('customerListV2'); if(!el)return;\n  el.innerHTML=arr.map(c=>`<div class="profileCard"><div class="profileHead"><div><b>${esc(c.shop_name||c.customer_name||'নাম নেই')}</b><div class="muted">${esc(c.customer_name||'')} ${c.phone?'• '+esc(c.phone):''}</div></div><div class="actions"><button class="secondary" onclick="openCustomerProfile(${c.id})">👁️ প্রোফাইল</button><button class="primary" onclick="memoForCustomer(${c.id})">🧾 মেমো করুন</button></div></div></div>`).join('')||'<div class="muted">কোনো ক্রেতার প্রোফাইল পাওয়া যায়নি।</div>';\n}\nfunction newCustomerProfile(){\n  const el=document.getElementById('customerProfileV2');el.classList.remove('hide');el.innerHTML=`<h3>➕ নতুন ক্রেতা প্রোফাইল</h3><form onsubmit="saveCustomerProfile(event)"><label>দোকানের নাম<input id="cpShop" required></label><label>ক্রেতার নাম<input id="cpName"></label><label>মোবাইল<input id="cpPhone"></label><label>ঠিকানা<input id="cpAddress"></label><label class="full">নোট<input id="cpNote"></label><button class="primary full">💾 প্রোফাইল সংরক্ষণ</button></form>`;el.scrollIntoView({behavior:'smooth'});\n}\nasync function saveCustomerProfile(e){e.preventDefault();const row={shop_name:cpShop.value.trim(),customer_name:cpName.value.trim(),phone:cpPhone.value.trim(),address:cpAddress.value.trim(),note:cpNote.value.trim(),updated_at:new Date().toISOString()};const {data,error}=await SB.from('customers').insert(row).select().single();if(error)return alert('প্রোফাইল সেভ হয়নি: '+error.message);activeCustomerId=data.id;await loadCustomerProfiles();openCustomerProfile(data.id);alert('✅ ক্রেতার প্রোফাইল তৈরি হয়েছে।')}\nasync function openCustomerProfile(id){\n  activeCustomerId=id; const c=(window.customerProfiles||[]).find(x=>x.id==id); if(!c)return;\n  const {data,error}=await SB.from('memos').select('*').eq('customer_id',id).order('created_at',{ascending:false}); if(error)return alert(error.message);\n  const rows=data||[], billed=rows.reduce((a,m)=>a+(+m.total||0),0),paid=rows.reduce((a,m)=>a+(+m.paid||0),0),due=rows.reduce((a,m)=>a+(+m.due||0),0);\n  const el=document.getElementById('customerProfileV2');el.classList.remove('hide');\n  el.innerHTML=`<div class="profileHead"><div><h2>👤 ${esc(c.shop_name||c.customer_name||'ক্রেতা')}</h2><div class="muted">${esc(c.customer_name||'')} ${c.phone?'• '+esc(c.phone):''}<br>${esc(c.address||'')}</div></div><div class="actions"><button class="primary" onclick="memoForCustomer(${id})">🧾 এই ক্রেতার মেমো</button><button onclick="editCustomerProfile(${id})">✏️ Edit</button></div></div><div class="profileStats"><div class="profileStat">মেমো<b>${rows.length}</b></div><div class="profileStat">মোট কেনা<b>${money(billed)}</b></div><div class="profileStat">পরিশোধ<b>${money(paid)}</b></div><div class="profileStat">বাকি<b class="${due?'red':''}">${money(due)}</b></div></div><h3>📚 মেমো ইতিহাস</h3><div class="tablewrap"><table><thead><tr><th>Serial</th><th>তারিখ</th><th>মোট</th><th>Paid</th><th>বাকি</th><th>Action</th></tr></thead><tbody>${rows.map(m=>`<tr><td>#${m.serial_number}</td><td>${new Date(m.created_at).toLocaleDateString('bn-BD')}</td><td>${money(m.total)}</td><td>${money(m.paid)}</td><td class="${+m.due?'red':''}">${money(m.due)}</td><td><button class="secondary" onclick="viewMemo(${m.id})">দেখুন</button>${+m.due?` <button class="primary" onclick="openPayment(${m.serial_number})">💰 পরিশোধ</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">এখনও কোনো মেমো নেই।</td></tr>'}</tbody></table></div>`;el.scrollIntoView({behavior:'smooth'});\n}\nfunction editCustomerProfile(id){const c=(window.customerProfiles||[]).find(x=>x.id==id);if(!c)return;const el=document.getElementById('customerProfileV2');el.innerHTML=`<h3>✏️ প্রোফাইল সম্পাদনা</h3><form onsubmit="updateCustomerProfile(event,${id})"><label>দোকানের নাম<input id="cpShop" value="${esc(c.shop_name||'')}"></label><label>ক্রেতার নাম<input id="cpName" value="${esc(c.customer_name||'')}"></label><label>মোবাইল<input id="cpPhone" value="${esc(c.phone||'')}"></label><label>ঠিকানা<input id="cpAddress" value="${esc(c.address||'')}"></label><label class="full">নোট<input id="cpNote" value="${esc(c.note||'')}"></label><button class="primary full">💾 আপডেট করুন</button></form>`;el.classList.remove('hide')}\nasync function updateCustomerProfile(e,id){e.preventDefault();const {error}=await SB.from('customers').update({shop_name:cpShop.value.trim(),customer_name:cpName.value.trim(),phone:cpPhone.value.trim(),address:cpAddress.value.trim(),note:cpNote.value.trim(),updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await loadCustomerProfiles();openCustomerProfile(id);alert('✅ প্রোফাইল আপডেট হয়েছে।')}\nfunction memoForCustomer(id){const c=(window.customerProfiles||[]).find(x=>x.id==id);if(!c)return;activeCustomerId=id;tab('memo',document.querySelector('nav button:nth-child(7)'));setTimeout(()=>{rn.value=c.customer_name||c.shop_name||'';rp.value=c.phone||'';document.getElementById('customerProfileHint')?.remove();const h=document.createElement('div');h.id='customerProfileHint';h.className='full card';h.style.margin='0';h.innerHTML=`👤 <b>প্রোফাইল: ${esc(c.shop_name||c.customer_name||'')}</b> — এই মেমোটি এই ক্রেতার হিসাবে যুক্ত হবে।`;shop.closest('label').after(h);},50)}\nconst _tabV2=window.tab; window.tab=function(id,b){_tabV2(id,b);if(id==='customer')setTimeout(ensureCustomerUI,0);if(id==='memo')setTimeout(commissionModeUI,0)};\nconst _addItemV2=window.addItem; window.addItem=function(){_addItemV2();setTimeout(toggleCommissionMode,0)};\nconst _calcPreviewV2=window.calcMemoPreview; window.calcMemoPreview=function(){const on=!!document.getElementById('commissionMode')?.checked;if(!on){const rows=getMemoRows();const gross=rows.reduce((a,x)=>a+x.qty*x.price,0);if(document.getElementById('commissionPreview'))commissionPreview.innerHTML=`মোট: <b>${money(gross)}</b> → কমিশন নেই → <b>মেমো মূল্য: ${money(gross)}</b>`;return {gross,gp:0,ga:0,after:gross,ep:0,ea:0,net:gross};}return _calcPreviewV2();};\nwindow.makeMemo=async function(e){e.preventDefault();const rows=getMemoRows();if(!rows.length)return alert('কমপক্ষে একটি ঔষধ যোগ করুন।');const on=!!document.getElementById('commissionMode')?.checked;const gross=rows.reduce((a,x)=>a+x.qty*x.price,0);let c={gross,gp:0,ga:0,after:gross,ep:0,ea:0,net:gross};if(on){c=commissionCalc(rows)}else{rows.forEach(x=>x.commission_pct=0)}const paid=+rpaid.value||0;if(paid>c.net)return alert('Paid মেমোর মূল/নিট টোটালের চেয়ে বেশি হতে পারবে না।');lastMemo={rows,gross:c.gross,generalCommissionPct:c.gp,generalCommissionAmount:c.ga,extraCommissionPct:c.ep,extraCommissionAmount:c.ea,discount:c.ga+c.ea,total:c.net,paid,due:Math.max(0,c.net-paid),serial:null,shop:shop.value,date:rd.value,customer:rn.value,phone:rp.value,customer_id:activeCustomerId,commissionEnabled:on};renderReceipt(lastMemo);receiptBox.classList.remove('hide');sellBtn.classList.remove('hide');receiptBox.scrollIntoView({behavior:'smooth'});};\nwindow.renderReceipt=function(m){const commOn=!!m.commissionEnabled;receipt.innerHTML=`<div class="receipt" id="printable"><h2>${esc(m.shop||'German Homeo Hall')}</h2><div class="center">Medicine Memo / Receipt<br><b class="memoSerial">Memo Serial: #${esc(m.serial||'সেল করুন')}</b><br>তারিখ: ${esc(m.date||today())}</div><p>ক্রেতা: ${esc(m.customer||'-')}<br>মোবাইল: ${esc(m.phone||'-')}</p><table><thead><tr><th>ঔষধ</th><th>Qty</th><th>MRP</th><th>TP/মূল্য</th><th>কমিশন %</th><th>মোট</th></tr></thead><tbody>${m.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.mrp||0)}</td><td>${money(x.price)}</td><td>${commOn?(x.commission_pct||0)+'%':'—'}</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</tbody></table><p class="right">গ্রস মোট: ${money(m.gross)}${commOn?`<br>General Commission (${m.generalCommissionPct||0}%): -${money(m.generalCommissionAmount)}<br>Extra Commission (${m.extraCommissionPct||0}%): -${money(m.extraCommissionAmount)}`:'<br>কমিশন: নেই'}<br><b>মূল/নিট মেমো: ${money(m.total)}</b><br>Paid: ${money(m.paid)}<br><span class="${m.due?'red':''}">Due: ${money(m.due)}</span></p><p class="center muted">ধন্যবাদ — German Homeo Hall</p></div>`};\nconst _sellMemoV2=window.sellMemo; window.sellMemo=async function(){if(!lastMemo)return alert('আগে মেমো তৈরি করুন।');const m=lastMemo;sellBtn.disabled=true;const {data,error}=await SB.rpc('save_memo_transaction',{p_shop_name:m.shop,p_customer_name:m.customer,p_customer_phone:m.phone,p_total:m.total,p_paid:m.paid,p_due:m.due,p_payment_method:rpay.value,p_note:'Saved from memo',p_items:m.rows});if(error){sellBtn.disabled=false;return alert('মেমো সেভ হয়নি: '+error.message)}const saved=(await SB.from('memos').select('*').eq('id',data).single()).data;if(saved){await SB.from('memos').update({customer_id:m.customer_id,commission_enabled:m.commissionEnabled||false,commission_type:m.commissionEnabled?'percentage':'none',commission_value:(m.generalCommissionPct||0)+(m.extraCommissionPct||0),gross_total:m.gross,general_commission_pct:m.generalCommissionPct||0,general_commission_amount:m.generalCommissionAmount||0,extra_commission_pct:m.extraCommissionPct||0,extra_commission_amount:m.extraCommissionAmount||0,discount:m.discount||0}).eq('id',data);const mi=await SB.from('memo_items').select('id').eq('memo_id',data).order('id');if(!mi.error){for(let i=0;i<Math.min(mi.data.length,m.rows.length);i++){await SB.from('memo_items').update({mrp:m.rows[i].mrp||0,commission_pct:m.rows[i].commission_pct||0}).eq('id',mi.data[i].id)}}lastMemo.serial=saved.serial_number;lastMemo.date=iso(saved.created_at);renderReceipt(lastMemo)}await load();sellBtn.disabled=false;sellBtn.classList.add('hide');alert(`✅ সেল সম্পন্ন। মেমো #${saved?.serial_number||data} সেভ হয়েছে।${m.due>0?' বাকি রাখা হয়েছে।':''}`)};\nconst _viewMemoV2=window.viewMemo; window.viewMemo=async function(id){const m=memos.find(x=>x.id==id);if(!m)return;const {data,error}=await SB.from('memo_items').select('*').eq('memo_id',id).order('id');if(error)return alert(error.message);lastMemo={rows:(data||[]).map(x=>({name:x.medicine_name,qty:x.quantity,price:x.unit_price,mrp:x.mrp||0,commission_pct:x.commission_pct||0})),gross:+(m.gross_total||m.total||0),generalCommissionPct:+m.general_commission_pct||0,generalCommissionAmount:+m.general_commission_amount||0,extraCommissionPct:+m.extra_commission_pct||0,extraCommissionAmount:+m.extra_commission_amount||0,total:+m.total||0,paid:+m.paid||0,due:+m.due||0,serial:m.serial_number,shop:m.shop_name||'German Homeo Hall',date:iso(m.created_at),customer:m.customer_name||'',phone:m.customer_phone||'',customer_id:m.customer_id,commissionEnabled:!!m.commission_enabled};renderReceipt(lastMemo);receiptBox.classList.remove('hide');receiptBox.scrollIntoView({behavior:'smooth'})};\nconst _memoShareV2=window.memoShareText;window.memoShareText=function(){if(!lastMemo)return '';const m=lastMemo;return `${m.shop||'German Homeo Hall'}\\n🧾 মেমো #${m.serial||'—'}\\nতারিখ: ${m.date||today()}\\nক্রেতা: ${m.customer||'-'}\\nমোবাইল: ${m.phone||'-'}\\nমোট: ${money(m.total)}\\nকমিশন: ${m.commissionEnabled?money((m.generalCommissionAmount||0)+(m.extraCommissionAmount||0)):'নেই'}\\nPaid: ${money(m.paid)}\\nবাকি: ${money(m.due)}`};\nsetTimeout(()=>{commissionModeUI();ensureCustomerUI()},100);\n</script>\n'''
          s=s.replace('</body>',patch+'</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit manager update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add medicine-manager-password.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add customer profiles and separate memo commission option'
          git push
