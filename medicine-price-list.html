<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>German Homeo Hall — মূল্য তালিকা</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f3f6f4;color:#18221d;margin:0}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e2e9e4;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 5px 20px #173b2a0b}h1{margin:0;font-size:24px}p{color:#66746d}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d5ded8;border-radius:11px;font:inherit}button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#25734d;color:#fff}.secondary{background:#eaf3ee;color:#195b3a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:500px}th,td{padding:11px;border-bottom:1px solid #e8eeea;text-align:left}th{background:#f6faf7}.price{font-weight:900}.muted{font-size:13px;color:#66746d}.count{font-weight:800;color:#25734d}@media print{.noPrint{display:none!important}.card{box-shadow:none;border:0}body{background:#fff}} </style></head><body><div class="wrap"><div class="card"><div class="top"><div><h1>💊 German Homeo Hall</h1><p>📋 ঔষধের মূল্য তালিকা</p></div><div class="count" id="count">লোড হচ্ছে...</div></div><div class="noPrint"><input id="search" placeholder="ঔষধ বা কোম্পানির নাম দিয়ে খুঁজুন..." oninput="render()"><div class="actions"><button class="primary" onclick="shareList()">📤 মূল্য তালিকা শেয়ার</button><button class="secondary" onclick="copyList()">📋 কপি</button><button class="secondary" onclick="window.print()">🖨️ Print / PDF</button></div></div></div><div class="card" id="listCard"><div class="tablewrap"><table><thead><tr><th>ক্রমিক</th><th>ঔষধের নাম</th><th>কোম্পানি</th><th>মূল্য</th></tr></thead><tbody id="list"></tbody></table></div></div></div><script>const SB=window.supabase.createClient('https://xhddvvvdynxabhdorsju.supabase.co','sb_publishable_aw8D0PEOLoPqEOMMQUBp6A_XeriyvD3');let meds=[];const money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){let {data,error}=await SB.from('medicines').select('name,company,sale_price').order('name');if(error){document.getElementById('list').innerHTML='<tr><td colspan="4">মূল্য তালিকা লোড করা যায়নি।</td></tr>';return}meds=data||[];render()}function filtered(){let q=(search.value||'').toLowerCase().trim();return meds.filter(m=>(m.name+' '+(m.company||'')).toLowerCase().includes(q))}function render(){let a=filtered();count.textContent=a.length+'টি ঔষধ';list.innerHTML=a.map((m,i)=>`<tr><td>${i+1}</td><td><b>${esc(m.name)}</b></td><td>${esc(m.company||'-')}</td><td class="price">${money(m.sale_price)}</td></tr>`).join('')||'<tr><td colspan="4">কোনো ঔষধ পাওয়া যায়নি।</td></tr>'}function text(){return '💊 German Homeo Hall\n📋 ঔষধের মূল্য তালিকা\n\n'+filtered().map((m,i)=>`${i+1}. ${m.name}${m.company?' — '+m.company:''} — ${money(m.sale_price)}`).join('\n')+'\n\nযোগাযোগ: German Homeo Hall'}async function copyList(){try{await navigator.clipboard.writeText(text());alert('মূল্য তালিকা কপি হয়েছে ✅')}catch(e){alert('কপি করা যায়নি।')}}async function shareList(){let t=text();if(navigator.share){try{await navigator.share({title:'German Homeo Hall — মূল্য তালিকা',text:t})}catch(e){}}else{await copyList();alert('আপনার ফোনে Share অপশন নেই, তাই তালিকাটি কপি করা হয়েছে। WhatsApp/Messenger-এ পেস্ট করে পাঠান।')}}load();</script></body></html>
