<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>German Homeo Hall — SmartBiz</title><style>html,body{margin:0;padding:0;background:#f4f7f5}iframe{display:block;width:100%;min-height:100vh;border:0}</style></head><body><iframe id="appFrame" src="medicine-manager.html?v=20260905"></iframe><script>(function(){const f=document.getElementById('appFrame');function patch(){try{const w=f.contentWindow,d=w.document;if(!d.getElementById('paid'))return;let paid=d.getElementById('paid');let old=d.getElementById('duePreview');if(!old){const lab=d.createElement('label');lab.id='dueLabel';lab.textContent='Due (অটো)';const inp=d.createElement('input');inp.id='duePreview';inp.type='text';inp.readOnly=true;inp.value='৳0';lab.appendChild(inp);paid.parentElement?.parentElement?.appendChild(lab)}function upd(){const total=[...d.querySelectorAll('#memoItems .mi-net')].reduce((a,x)=>a+Number(String(x.textContent||'0').replace(/[^0-9.-]/g,'')) ,0);const p=Math.min(Math.max(0,Number(paid.value||0)),total);const due=Math.max(0,total-p);const el=d.getElementById('duePreview');if(el)el.value='৳'+due.toLocaleString('en-BD',{minimumFractionDigits:2,maximumFractionDigits:2})}paid.removeAttribute('oninput');paid.addEventListener('input',upd);d.addEventListener('input',function(e){if(e.target.matches('.mi-qty,.mi-tp,.mi-gen,.mi-extra'))setTimeout(upd,0)});const original=d.defaultView.saveMemo;d.defaultView.saveMemo=async function(e){e.preventDefault();try{const rows=[...d.querySelectorAll('#memoItems .item')];if(!rows.length){alert('কমপক্ষে একটি ঔষধ যোগ করুন');return}const items=rows.map(r=>({name:(r.querySelector('.mi-name')?.value||'').trim(),qty:Number(r.querySelector('.mi-qty')?.value||0),mrp:Number(r.querySelector('.mi-mrp')?.value||0),tp:Number(r.querySelector('.mi-tp')?.value||0),gen:Number(r.querySelector('.mi-gen')?.value||0),extra:Number(r.querySelector('.mi-extra')?.value||0),net:Number(String(r.querySelector('.mi-net')?.textContent||'0').replace(/[^0-9.-]/g,''))})).filter(x=>x.name&&x.qty>0);if(!items.length){alert('ঔষধের নাম ও Qty দিন');return}const total=items.reduce((a,x)=>a+x.net,0);const paid=Math.min(Math.max(0,Number(paid.value||0)),total);const due=Math.max(0,total-paid);const customerName=(d.getElementById('memoCustomer')?.value||'').trim();const phone=(d.getElementById('memoPhone')?.value||'').trim();const shop=(d.getElementById('shop')?.value||'German Homeo Hall').trim();const note=(d.getElementById('memoNote')?.value||'').trim();const pay=(d.getElementById('pay')?.value||'Cash');const c=await w.getOrCreateCustomer(customerName,phone);const payload=items.map(x=>({name:x.name,qty:x.qty,price:x.net/x.qty,mrp:x.mrp,commission_pct:x.gen+x.extra}));const r=await w.SB.rpc('save_memo_transaction',{p_shop_name:shop,p_customer_name:customerName,p_customer_phone:phone,p_total:total,p_paid:paid,p_due:due,p_payment_method:pay,p_note:note,p_items:payload});if(r.error)throw r.error;const mId=Number(r.data);await w.load();const m=w.memos.find(x=>Number(x.id)===mId)||{id:mId,serial_number:mId,created_at:new Date().toISOString(),shop_name:shop,customer_name:customerName,customer_phone:phone,total,paid,due,note};d.getElementById('receipt').innerHTML=w.receiptHTML(m,items.map(x=>({name:x.name,qty:x.qty,tp:x.net/x.qty,mrp:x.mrp,g:x.gen,x:x.extra,net:x.net})));d.getElementById('receiptBox').classList.remove('hide');d.getElementById('paid').value=paid;upd();alert('✅ মেমো সেভ হয়েছে। Paid: '+w.money(paid)+' | Due: '+w.money(due))}catch(err){alert('মেমো সেভ হয়নি: '+(err?.message||err))}};upd()}catch(e){console.log(e)}}f.addEventListener('load',function(){setTimeout(patch,300);setTimeout(patch,1200)});})();</script></body></html>
