<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>German Homeo Hall — Online Medicine Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0;color:#172033}header{background:#1d5b3a;color:#fff;padding:20px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0}input,button{padding:11px;border-radius:9px;border:1px solid #ddd;margin:4px 0}button{font-weight:700;cursor:pointer}.primary{background:#26734a;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat b{display:block;font-size:24px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>German Homeo Hall</h1><div>Online Medicine Manager</div></header><main><div id="login" class="card"><h2>লগইন</h2><input id="email" type="email" placeholder="ইমেইল"><input id="password" type="password" placeholder="পাসওয়ার্ড"><br><button class="primary" onclick="login()">লগইন</button><button onclick="signup()">নতুন অ্যাকাউন্ট</button><p id="msg"></p></div><div id="app" style="display:none"><div class="grid"><div class="card stat">ওষুধ<b id="n">0</b></div><div class="card stat">স্টক<b id="q">0</b></div><div class="card stat">বিক্রি<b id="t">৳0</b></div><div class="card stat">লাভ<b id="p">৳0</b></div></div><div class="card"><h3>নতুন ওষুধ</h3><input id="name" placeholder="ওষুধের নাম"><input id="company" placeholder="কোম্পানি"><input id="buy" type="number" placeholder="ক্রয়মূল্য"><input id="sell" type="number" placeholder="বিক্রয়মূল্য"><input id="stock" type="number" placeholder="স্টক"><button class="primary" onclick="addMed()">সংরক্ষণ</button></div><div class="card"><h3>ওষুধের তালিকা</h3><table><thead><tr><th>নাম</th><th>কোম্পানি</th><th>ক্রয়</th><th>বিক্রি</th><th>স্টক</th></tr></thead><tbody id="rows"></tbody></table></div><button onclick="logout()">লগআউট</button></div></main><script>const sb=supabase.createClient('https://xhddvvvdynxabhdorsju.supabase.co','sb_publishable_aw8D0PEOLoPqEOMMQUBp6A_XeriyvD3');let meds=[];function money(x){return '৳'+Number(x||0).toFixed(2)}async function signup(){let{error}=await sb.auth.signUp({email:email.value,password:password.value});msg.textContent=error?error.message:'অ্যাকাউন্ট তৈরি হয়েছে; ইমেইল কনফার্ম করুন যদি চায়।'}async function login(){let{data,error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.textContent=error.message;else init()}async function logout(){await sb.auth.signOut();location.reload()}async function init(){login.style.display='none';app.style.display='block';await load()}async function load(){let r=await sb.from('medicines').select('*').order('name');if(r.error)return alert(r.error.message);meds=r.data||[];render()}function render(){n.textContent=meds.length;q.textContent=meds.reduce((a,m)=>a+m.stock,0);rows.innerHTML=meds.map(m=>`<tr><td>${m.name}</td><td>${m.company||''}</td><td>${money(m.purchase_price)}</td><td>${money(m.sale_price)}</td><td>${m.stock}</td></tr>`).join('')}async function addMed(){let{error}=await sb.from('medicines').insert({name:name.value,company:company.value,purchase_price:+buy.value,sale_price:+sell.value,stock:+stock.value});if(error)alert(error.message);else{await load();name.value=company.value=buy.value=sell.value=stock.value='';alert('ওষুধ যোগ হয়েছে')}}sb.auth.getSession().then(x=>{if(x.data.session)init()})</script></body></html>
